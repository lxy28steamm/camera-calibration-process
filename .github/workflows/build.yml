name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: windows-2025
            python: "3.12"
          - os: macos-14
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ego-calibration-${{ runner.os }}-${{ runner.arch }}
          path: dist/ego-calibration-*
